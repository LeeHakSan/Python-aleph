<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>부산 테마여행 목록</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 text-gray-800 min-h-screen flex flex-col">

    <header class="bg-white shadow-sm sticky top-0 z-10">
        <div class="max-w-4xl mx-auto px-4 py-4 flex justify-between items-center">
            <h1 class="text-xl font-bold text-indigo-600 cursor-pointer" onclick="location.href='/'">✨ 모던 게시판 & 부산 테마여행</h1>
            <a href="/" class="text-sm bg-gray-100 text-gray-700 px-3 py-1.5 rounded-lg font-medium hover:bg-gray-200 transition">홈으로 돌아가기</a>
        </div>
    </header>

    <main class="max-w-4xl mx-auto px-4 py-6 flex-1 w-full">
        <div class="bg-white p-6 rounded-xl shadow-sm mb-6">
            <h2 class="text-xl font-bold text-gray-900 mb-1">부산 테마여행 정보 (최대 100건)</h2>
            <p class="text-sm text-gray-500">공공데이터 오픈 API를 연동하여 실시간으로 100건의 데이터를 불러옵니다.</p>
        </div>

        <div id="loading" class="text-center py-12 text-gray-500 bg-white rounded-xl shadow-sm">데이터를 불러오는 중입니다...</div>
        
        <div id="post-list-container" class="space-y-4"></div>
    </main>

    <script>
        async function fetchPublicPosts() {
            try {
                const response = await fetch('/api/public/posts');
                const data = await response.json();
                
                // 명세서 규격에 따른 파싱 (getRecommendedKr -> item 배열)
                const items = data.getRecommendedKr?.item || [];
                const container = document.getElementById('post-list-container');
                document.getElementById('loading').style.display = 'none';

                if (items.length === 0) {
                    container.innerHTML = '<div class="text-center py-12 text-gray-400 bg-white rounded-xl shadow-sm">데이터가 없습니다. 인증키를 확인해주세요.</div>';
                    return;
                }

                items.forEach(item => {
                    const card = document.createElement('div');
                    card.className = "bg-white p-4 rounded-xl shadow-sm border border-gray-100 hover:shadow-md transition flex gap-4 items-center cursor-pointer";
                    card.onclick = () => {
                        window.location.href = `/public-posts/${item.UC_SEQ}`;
                    };

                    // API 썸네일 경로가 상대 경로('/')로 시작할 경우 도메인 결합
                    let thumbUrl = item.MAIN_IMG_THUMB || '';
                    if (thumbUrl && thumbUrl.startsWith('/')) {
                        thumbUrl = 'http://apis.data.go.kr' + thumbUrl;
                    }

                    // 설명 정제 (HTML 태그 제거)
                    const rawContent = item.ITEMCNTNTS ? item.ITEMCNTNTS.replace(/<[^>]*>?/gm, '') : '설명이 없습니다.';

                    card.innerHTML = `
                        <img src="${thumbUrl}" alt="썸네일" class="w-24 h-24 object-cover rounded-lg bg-gray-200 flex-shrink-0" onerror="this.src='https://via.placeholder.com/100?text=No+Image'">
                        <div class="flex-1 min-w-0">
                            <span class="text-xs font-semibold px-2 py-0.5 rounded-full bg-indigo-50 text-indigo-600">${item.GUGUN_NM || '부산'}</span>
                            <h3 class="text-base font-bold text-gray-900 mt-1 truncate">${item.TITLE || '제목 없음'}</h3>
                            <p class="text-xs text-gray-500 mt-1 line-clamp-2">${rawContent}</p>
                        </div>
                    `;
                    container.appendChild(card);
                });
            } catch (error) {
                document.getElementById('loading').innerText = '데이터를 불러오는 중 오류가 발생했습니다.';
                console.error(error);
            }
        }

        fetchPublicPosts();
    </script>
</body>
</html>
